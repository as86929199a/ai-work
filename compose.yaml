services:
  bus936:
    build:
      context: .
      dockerfile: Dockerfile
    image: bus936:latest
    container_name: bus936
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TDX_CLIENT_ID: ${TDX_CLIENT_ID:?required}
      TDX_CLIENT_SECRET: ${TDX_CLIENT_SECRET:?required}
    networks:
      - bus936-network

  ngrok:
    image: ngrok/ngrok:latest
    container_name: bus936-ngrok
    restart: unless-stopped
    depends_on:
      - bus936
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?required}
    command:
      - http
      - bus936:8080
      - --log=stdout
    networks:
      - bus936-network

networks:
  bus936-network:
    driver: bridge